<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Fraud Detection App</a>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 500px;">
        <h2 class="mb-4">Check Transaction</h2>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% for feature in features %}
            <div class="mb-3">
                <label for="{{ feature }}" class="form-label">{{ feature.replace('_', ' ').title() }}</label>
                <input type="number" step="any" class="form-control" id="{{ feature }}" name="{{ feature }}" required>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>

        {% if prediction %}
        <div class="alert {% if 'Fraud' in prediction and 'Not' not in prediction %}alert-danger{% else %}alert-success{% endif %} mt-4" role="alert">
            <h4>{{ prediction }}</h4>
            <p>Fraud Probability: {{ probability }}%</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
